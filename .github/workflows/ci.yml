# CI for every push and pull request (PLAN S0.1). Three jobs, all must be green:
#   unit   - build the page, check that the committed page is fresh, then typecheck + Vitest
#   helper - the Python helper's unittest suite on the oldest (3.8) and a current (3.12) Python
#   e2e    - Playwright: two real helpers sharing one temp folder, driven in Chromium
name: ci
on:
  push:
    branches: ["**"]          # tags run these jobs through release.yml
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to 26.04, which has no Python 3.8 build.
# A caller (release.yml) must not use this concurrency group itself, or the two would wait on each other.
jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # build first: tests/build.test.ts compares backend/slide_builder.html with a fresh build
      - run: npm run build
      - name: committed page matches the sources
        run: git diff --exit-code -- ../backend/slide_builder.html || (echo "backend/slide_builder.html is stale - run npm run build and commit it" && exit 1)
      - run: npm run check

  helper:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { python: ["3.8", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s backend/tests

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Ubuntu 24.04 forbids unprivileged user namespaces (AppArmor), so Chrome's sandbox cannot start and
      # the helper's export engine sees "the browser closed immediately". Allow them, as on a normal desktop.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e
        run: |
          # playwright.config.ts reads CHROME (the helpers also use it as their export browser)
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "frontend/test-results/", if-no-files-found: ignore }
