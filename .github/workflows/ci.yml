# CI for every push and pull request (PLAN S0.1). All jobs must be green:
#   unit   - build the page, check that the committed page is fresh, then typecheck + Vitest (app/)
#   core   - core/ on its own: typecheck with no DOM types (lib ES2022 + WebWorker, PLAN S1.2) + its Vitest suite
#   helper - the Python helper's unittest suite on the oldest (3.8) and a current (3.12) Python
#   e2e    - Playwright: two real helpers sharing one temp folder, driven in Chromium
#   parity - v3 against golden/
#   pdf    - npm run sp: the display list's PDF (core/src/pdf) rendered by PDFium against Chromium's canvas, qpdf --check;
#            npm run export-check: the native export of three corpus decks (S3.7)
#   bench  - npm run bench: benchmarks with thresholds (big30 parsing in core, render counts in app, the page in Chromium)
#   load   - tools/loadtest4.py --ci: 20 real helpers on one folder at 15 and 40 ms simulated latency (05 §3.5)
# npm workspaces: one lockfile and node_modules/ at the root; the scripts run from the root.
name: ci
on:
  push:
    branches: ["**"]          # tags run these jobs through release.yml
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to 26.04, which has no Python 3.8 build.
# A caller (release.yml) must not use this concurrency group itself, or the two would wait on each other.
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      # build first: tests/build.test.ts compares helper/slide_builder.html with a fresh build
      - run: npm run build
      - name: committed page matches the sources
        run: git diff --exit-code -- helper/slide_builder.html || (echo "helper/slide_builder.html is stale - run npm run build and commit it" && exit 1)
      - run: npm run check -w app

  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run check -w core

  helper:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { python: ["3.8", "3.12"] }
    steps:
      # the migration tests run the real v3 helper from a worktree of the last v3 release tag (05 §3.6, tests 7-9)
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s helper/tests

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Ubuntu 24.04 forbids unprivileged user namespaces (AppArmor), so a sandboxed Chrome cannot start (until 3.8 the
      # helper's export engine saw "the browser closed immediately"). Allow them, as on a normal desktop.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e
        run: |
          # playwright.config.ts reads CHROME
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "app/test-results/", if-no-files-found: ignore }

  bench:
    # PLAN Part A rule 7: a step marked ⏱ adds a benchmark with a threshold; above it + 10 % the job fails.
    # big30.xlsx (30 MB) is generated, not committed: openpyxl is a dev tool here, the helper stays stdlib-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      # tools/bench.mjs: the committed page with a real helper in Chromium (S2.6)
      - run: npx playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install openpyxl==3.1.5 pillow==11.3.0
      - run: python tools/make_corpus.py big30 tests/corpus/workbooks
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-results, path: bench-results.json, if-no-files-found: ignore }
      # the cell-by-cell equivalence with v3's parser on big30 too (the unit job has no big30)
      - run: npx vitest run tests/sheetstore.test.ts
        working-directory: core

  load:
    # PLAN S5.4, 05 §3.5: real v4 helpers (one per user) on one folder with simulated share latency (simfs):
    # 20 users at 15 and 40 ms - same deck, different decks, a burst, compaction while editing. Fails when a
    # criterion fails: save p95 < 150 ms, visible p95 < 4 s, nothing lost, every view the same
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/loadtest4.py --ci --json load-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: load-results, path: load-results.json, if-no-files-found: ignore }

  parity:
    # v3 against its goldens (golden/, tools/parity.mjs). Texts are compared on any machine; geometry, pixels
    # and PDF positions only where Chromium and the fonts equal the capture's (golden/MANIFEST.json), which
    # a hosted runner does not - the report says which mode ran.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install pypdf      # dev tool for pdf.json (tools/pdftext.py); the helper stays stdlib-only
      - name: parity
        run: |
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run parity
      # the display list against the same goldens (S3.3 on): texts and styles here, geometry and pixels on the reference PC
      - name: display-list parity
        run: |
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run dlparity
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parity-report, path: "tests/parity/report*/", if-no-files-found: ignore }

  pdf:
    # PLAN S3.1: every display-list node type as a PDF, checked by qpdf and pdfcheck.py (no Type 3, no variable font),
    # rendered by PDFium and compared with the same display list drawn on a Chromium canvas (tools/dlcheck.mjs).
    # pypdf, pypdfium2 and qpdf are dev tools here; the helper stays stdlib-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y qpdf
      # python-pptx and openpyxl: tools/pptxcheck.py (S11.1, dev only; PowerPoint itself is checked on Windows, PROGRESS)
      - run: python -m pip install pypdf==6.7.5 pypdfium2==5.14.0 pillow==11.3.0 python-pptx==1.0.2 openpyxl==3.1.5
      - run: npm run sp
      # PLAN S3.7: the native export of three corpus decks in every design, through the app (export workers, helper):
      # qpdf, no Type 3 / variable fonts, the text against the goldens, deck20's size and time (scaled like the bench)
      - name: native export
        run: |
          export CHROME="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run export-check -- --decks weekly-options,report-looks,deck20 --no-ppt --out tests/parity/report/export
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dl-report, path: "tests/parity/report/dl/", if-no-files-found: ignore }
