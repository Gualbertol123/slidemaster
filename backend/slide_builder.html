*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh}

.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;margin-right:6px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#59A8FF,#8D6BFF 60%,#FF9A7A);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 1px 3px rgba(40,50,90,.3)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;white-space:nowrap}
.btn:hover{background:#F7F8FA}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:#0858BD}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.split{border-top-right-radius:0;border-bottom-right-radius:0}
.btn.caret{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px;width:28px;padding:0;justify-content:center}
.fname{min-width:0;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.fname b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#fff;height:32px}
.seg button{border:0;background:transparent;padding:0 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;background:#F1F2F5;color:var(--mute);font-size:12px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#9CA3AF}
.pill.ok .dot{background:var(--ok)} .pill.warn .dot{background:#F59E0B} .pill.err .dot{background:var(--err)}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);min-width:260px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,24,40,.16);padding:6px;z-index:100;display:none}
.menu.right{right:0}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}
.menu button:hover{background:#F2F4F8}
.menu button small{margin-left:auto;color:var(--mute);font-size:11.5px}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .hd{font-size:11px;color:var(--mute);padding:6px 10px 3px;text-transform:none}
.menu .empty{padding:8px 10px;color:var(--mute)}

/* ribbon */
.ribbon{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ribbon .grp{display:flex;align-items:center;gap:4px;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.ribbon .grp:last-child{border-right:0}
.ribbon .lbl{font-size:11px;color:var(--mute);margin-right:2px}
.tb{height:30px;min-width:30px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb:hover:not(:disabled){background:#F1F3F6;border-color:var(--line)}
.tb.on{background:var(--accent-soft);border-color:#C7DBF6;color:var(--accent)}
.tb:disabled{opacity:.38;cursor:default}
.tb svg{width:16px;height:16px}
.tb .sw{width:16px;height:4px;border-radius:2px;display:block;margin-top:1px}
.tb.colorbtn{flex-direction:column;gap:0;line-height:1;font-weight:700}
.sizebox{width:58px;height:30px;border:1px solid var(--line2);border-radius:7px;padding:0 6px;text-align:center;background:#fff}
.sizebox:disabled{opacity:.45}
.swatches{display:grid;grid-template-columns:repeat(6,26px);gap:6px;padding:6px}
.swatches button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);padding:0}
.swatches button.none{background:linear-gradient(135deg,#fff 46%,#E5484D 47%,#E5484D 53%,#fff 54%)}
.menu .wide{display:flex;gap:6px;padding:4px 6px 6px}
.menu .wide button{flex:1;justify-content:center;border:1px solid var(--line);padding:6px}

/* formula bar */
.fxbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:#FAFBFC;border-bottom:1px solid var(--line)}
.namebox{width:110px;height:28px;border:1px solid var(--line2);border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 8px;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;overflow:hidden}
.fxlabel{font-style:italic;color:var(--mute);font-family:Georgia,serif;width:18px;text-align:center}
.fxinput{flex:1;height:28px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;background:#fff}
.fxinput:focus,.sizebox:focus,.namebox:focus{outline:2px solid #A9C8F3;outline-offset:-1px;border-color:var(--accent)}
.fxhint{font-size:11.5px;color:var(--mute);white-space:nowrap}

/* main */
.main{display:grid;grid-template-columns:250px 1fr;min-height:0}
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.navhd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-size:11.5px;color:var(--mute);font-weight:600}
.thumbs{overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.thumb{position:relative;border:2px solid transparent;border-radius:10px;padding:0;background:none;text-align:left}
.thumb .frame{width:222px;height:125px;border-radius:8px;overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(20,24,40,.18);background:#fff}
.thumb .frame .slide{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(.13875);pointer-events:none}
.thumb .cap{display:flex;gap:6px;align-items:center;font-size:12px;padding:5px 2px 0;color:var(--mute)}
.thumb .cap b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .cap .n{font-variant-numeric:tabular-nums}
.thumb .badge{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:8px;background:#FEF3C7;color:var(--warn)}
.thumb.on .frame{outline:2.5px solid var(--accent);outline-offset:2px}
.issues{border-top:1px solid var(--line);padding:10px 14px 12px;max-height:38%;overflow:auto;font-size:12px}
.issues h4{margin:0 0 6px;font-size:11.5px;color:var(--mute);font-weight:600}
.issues ul{margin:0;padding-left:16px}
.issues li{margin:3px 0}
.issues .warn{color:var(--warn)} .issues .err{color:var(--err)} .issues .ok{color:var(--ok)}
.issues code{font-size:11px;background:#F1F3F6;padding:0 3px;border-radius:3px}

.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,rgba(20,24,40,.07) 1px,transparent 1.2px) 0 0/18px 18px,var(--bg)}
.stagewrap{position:absolute;box-shadow:0 10px 40px rgba(20,24,40,.18),0 1px 3px rgba(20,24,40,.12);border-radius:4px;overflow:hidden;background:#fff}
.stagewrap > .slide{position:absolute;left:0;top:0;transform-origin:0 0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);text-align:center;padding:24px}
.empty .big{font-size:18px;color:var(--ink);font-weight:600}
.empty .drop{border:2px dashed var(--line2);border-radius:14px;padding:26px 34px;background:rgba(255,255,255,.7)}
.dragover .canvas::after{content:"Drop the workbook to open it";position:absolute;inset:12px;border:2.5px dashed var(--accent);border-radius:14px;background:rgba(231,240,252,.8);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--accent);z-index:50}
.zoomctl{position:absolute;right:14px;bottom:12px;display:flex;gap:4px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:0 2px 8px rgba(20,24,40,.08);z-index:30}
.zoomctl button{border:0;background:none;width:26px;height:24px;border-radius:6px}
.zoomctl button:hover{background:#F1F3F6}
.zoomctl span{min-width:44px;text-align:center;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

.statusbar{display:flex;align-items:center;gap:16px;padding:4px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--mute);white-space:nowrap}
.statusbar .ok{color:var(--ok)} .statusbar .err{color:var(--err)}

.banner{display:none;padding:8px 14px;background:#FFF7E6;border-bottom:1px solid #F5D9A8;color:#7A4B00;font-size:12.5px}
.banner.show{display:block}
.banner.info{background:#EEF5FF;border-color:#C9DDF7;color:#0B4A99}
.banner button{margin-left:10px}

.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1F2330;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:all .18s ease;z-index:200;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:7px;padding:5px 10px}
.toast.err{background:#7F1D1D}

/* editing overlay inside the slide */
.slide .hits{position:absolute;left:0;top:0;z-index:40;cursor:cell}
.slide .hits .hov{position:absolute;display:none;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(10,102,216,.5)}
.slide .selbox{position:absolute;pointer-events:none;background:rgba(10,102,216,.10);box-shadow:inset 0 0 0 1.5px rgba(10,102,216,.9);z-index:2}
.slide .actbox{position:absolute;pointer-events:none;box-shadow:inset 0 0 0 2.5px #0A66D8,0 0 0 1px rgba(255,255,255,.9);z-index:3}
.slide .hbox{position:absolute;pointer-events:none;z-index:45}
.slide .hbox .grip,.slide .hbox .size{position:absolute;pointer-events:auto;opacity:0;transition:opacity .12s}
.stagewrap:hover .hbox .grip,.stagewrap:hover .hbox .size,.slide .hbox.active .grip,.slide .hbox.active .size{opacity:1}
.slide .hbox .grip{left:-2px;top:-34px;height:28px;padding:0 10px;border-radius:14px;background:#0A66D8;color:#fff;font:600 13px/28px var(--font);cursor:grab;user-select:none;white-space:nowrap;box-shadow:0 3px 10px rgba(10,102,216,.35)}
.slide .hbox.active{outline:2px dashed rgba(10,102,216,.7);outline-offset:4px}
.slide .hbox.active .grip{cursor:grabbing}
.slide .hbox .size{right:-14px;bottom:-14px;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0A66D8;cursor:nwse-resize;box-shadow:0 2px 8px rgba(10,102,216,.35)}
.slide .dropmark{position:absolute;display:none;background:#0A66D8;border-radius:3px;pointer-events:none;z-index:46}
.inline-edit{position:absolute;z-index:80;box-sizing:border-box;border:2px solid #0A66D8;border-radius:3px;padding:0 6px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);outline:none;font-family:var(--font)}

/* render mode (used by the export engine) */
body.render{overflow:visible;background:#fff}
body.render .app,body.render .toast{display:none}
#renderRoot{position:relative}
#renderRoot .slide{position:relative}
#renderRoot.stack .slide{break-after:page;page-break-after:always}
#renderRoot.stack .slide:last-child{break-after:auto;page-break-after:auto}

/* sheet chooser */
.modal{position:fixed;inset:0;background:rgba(18,22,34,.38);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(2px)}
.dlg{width:min(640px,92vw);max-height:84vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(10,14,30,.35);overflow:hidden}
.dlghd{display:flex;flex-direction:column;gap:2px;padding:16px 18px 10px}
.dlghd b{font-size:15px}
.dlghd span{color:var(--mute);font-size:12.5px}
.dlgtools{display:flex;gap:6px;align-items:center;padding:0 18px 10px}
.dlgtools .btn{height:28px;font-size:12.5px}
.dlgtools .cnt{margin-left:auto;color:var(--mute);font-size:12.5px}
.sheetlist{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px}
.sheetrow{display:grid;grid-template-columns:22px auto auto auto 1fr;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer}
.sheetrow:hover{background:#F4F6F9}
.sheetrow input{width:16px;height:16px;accent-color:var(--accent)}
.sheetrow .nm{font-weight:600}
.sheetrow .meta{grid-column:2/-1;color:var(--mute);font-size:12px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetrow.hid .nm{color:var(--mute)}
.chip{font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.grey{background:#F1F2F5;color:var(--mute)}
.emptyrow{padding:14px;color:var(--mute)}
.skipped{padding:8px 18px 0;font-size:12px;color:var(--mute)}
.skipped summary{cursor:pointer}
.skipped div{padding:6px 0 0 14px}
.dlgft{display:flex;gap:8px;align-items:center;padding:12px 18px}
.dlgft .hint{margin-right:auto;color:var(--mute);font-size:12px}

.thumb .cap .tag{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.3px}
.chip.green{background:#E3F6EA;color:#1F7A3E}
.slide [data-edit]{cursor:text}
.stagewrap .slide [data-edit]:hover{outline:1.5px dashed rgba(10,102,216,.5);outline-offset:4px;border-radius:4px}

/* ---------------- wizard ---------------- */
.wiz{position:fixed;inset:0;z-index:400;background:rgba(18,22,34,.42);display:flex;align-items:center;justify-content:center}
.wizbox{width:min(1380px,96vw);height:min(900px,94vh);background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(10,14,30,.4);display:flex;flex-direction:column;overflow:hidden}
.wizhd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.wizhd b{font-size:15px}
.wizhd > span{color:var(--mute);font-size:12.5px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;gap:6px;margin:0 0 0 auto;padding:0;list-style:none}
.steps li{padding:6px 12px;border-radius:16px;background:#F1F3F6;color:var(--mute);font-size:12.5px;cursor:pointer;user-select:none}
.steps li.on{background:var(--accent);color:#fff;font-weight:600}
.steps li.done{background:var(--accent-soft);color:var(--accent)}
.wizbody{flex:1;min-height:0;overflow:hidden;display:flex}
.wizft{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FAFBFC}
.wizft .hint{margin-right:auto;color:var(--mute);font-size:12px}
.wizcol{flex:1;overflow:auto;padding:16px 22px}
.wizcol .lead{margin:0 0 10px;color:#3B4252}
.sheetlist.big{border:1px solid var(--line);border-radius:10px;max-height:none}
.wiz2{display:grid;grid-template-columns:200px 1fr 320px;flex:1;min-height:0}
.wtabs{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:4px;background:#FAFBFC}
.wtab{display:flex;align-items:center;gap:6px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px}
.wtab span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtab:hover{background:#F0F2F6}
.wtab.on{background:#fff;border-color:var(--line2);box-shadow:0 1px 3px rgba(20,24,40,.08);font-weight:600}
.badge2{font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:9px;background:#E9EDF3;color:var(--mute)}
.wtab.on .badge2{background:var(--accent);color:#fff}
.wgridwrap{overflow:auto;position:relative;background:#fff}
.wgrid{position:relative;display:inline-block;min-width:100%;user-select:none}
.clipnote{position:sticky;left:0;top:0;z-index:5;background:#FFF7E6;color:#7A4B00;font-size:12px;padding:4px 10px}
table.xs{border-collapse:collapse;table-layout:fixed;font:11.5px/1.2 "Segoe UI",Calibri,Arial,sans-serif}
table.xs th{position:sticky;background:#F3F4F6;color:#6B7280;font-weight:500;border:1px solid #E1E3E8;font-size:10.5px;overflow:hidden;white-space:nowrap;z-index:3}
table.xs thead th{top:0}
table.xs tbody th{left:0;text-align:center}
table.xs th.corner{left:0;z-index:4}
table.xs th.hid,table.xs td.hid,table.xs tr.hid th{background:repeating-linear-gradient(45deg,#E5E7EB 0 3px,#F5F6F8 3px 6px)}
table.xs td{border:1px solid #EDEEF1;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;color:#111}
table.xs td.mk{background:#FFF4CC!important;color:#9A6B00;font-weight:700;text-align:center}
.wov{position:absolute;inset:0;pointer-events:none}
.ovb{position:absolute;box-sizing:border-box;border-radius:3px}
.ovb.tbl{border:2px solid #0A66D8;background:rgba(10,102,216,.07);pointer-events:auto;cursor:pointer}
.ovb.tbl.hl{background:rgba(10,102,216,.18)}
.ovb.tbl span{position:absolute;left:-2px;top:-20px;background:#0A66D8;color:#fff;font:600 11px/18px "Segoe UI",sans-serif;padding:0 6px;border-radius:4px 4px 0 0}
.ovb.sug{border:2px dashed #8A63D2;background:rgba(138,99,210,.05)}
.ovb.sug button{position:absolute;right:-2px;top:-22px;pointer-events:auto;background:#8A63D2;color:#fff;border:0;border-radius:5px;font:600 11px/20px "Segoe UI",sans-serif;padding:0 8px}
.ovb.sel{border:2px solid #16A34A;background:rgba(22,163,74,.10)}
.wside{border-left:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px;background:#FAFBFC}
.wside .lbl{font-size:11.5px;color:var(--mute);font-weight:600}
.wside .row{display:flex;gap:6px;align-items:center}
.wside input:not([type=checkbox]){flex:1;min-width:0;height:30px;border:1px solid var(--line2);border-radius:7px;padding:0 8px;background:#fff;font-variant-numeric:tabular-nums}
.wside input.bad{border-color:var(--err);background:#FFF1F0}
.wtools{display:flex;flex-wrap:wrap;gap:6px}
.wtools .btn{height:30px;font-size:12.5px}
.ck{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#3B4252;white-space:nowrap}
.wtlist{display:flex;flex-direction:column;gap:8px}
.wtrow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;transition:box-shadow .2s}
.wtrow.flash{box-shadow:0 0 0 3px rgba(10,102,216,.35)}
.wtrow .rng{font-size:12px;color:var(--mute)}
.wtrow .meta{font-size:11.5px;color:var(--mute)}
.wtrow .del{width:28px;height:28px}
.wiz3{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.pool{border-right:1px solid var(--line);overflow:auto;padding:12px;background:#FAFBFC;display:flex;flex-direction:column;gap:10px}
.pgrp{display:flex;flex-direction:column;gap:6px}
.pgrp .lbl{font-size:11.5px;color:var(--mute);font-weight:600}
.tchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:6px 9px;cursor:grab;font-size:12.5px;max-width:100%}
.tchip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip span{color:var(--mute);font-size:11.5px;white-space:nowrap}
.tchip.free{border-color:#B9D2F3;background:#F4F8FE}
.tchip.in{background:var(--accent-soft);border-color:#C7DBF6}
.tchip.in button{border:0;background:none;color:var(--mute);padding:0 2px}
.deck{overflow:auto;padding:14px 18px}
.extra{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#FAFBFC}
.ck.big{font-size:13px;font-weight:600}
.extraf{display:flex;gap:6px;flex-wrap:wrap}
.extraf.off{opacity:.45;pointer-events:none}
.extraf input,.scard input{height:30px;border:1px solid var(--line2);border-radius:7px;padding:0 8px;background:#fff;flex:1;min-width:150px}
.slist{display:flex;flex-direction:column;gap:10px}
.scard{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff}
.scard.focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,102,216,.15)}
.scard .row{display:flex;gap:6px;align-items:center}
.scard .sn{width:26px;height:26px;border-radius:13px;background:#EEF1F5;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.scard .stitle{font-weight:600}
.scard .btn.icon{width:30px;height:30px;flex:none}

.slide.glass .pic.gcut{overflow:visible;filter:drop-shadow(0 3px 5px rgba(28,40,100,.28))}

/* ---------------- Excel design ---------------- */
.slide.excel{font-family:"Century Gothic","CenturyGothic","URW Gothic","AppleGothic",Arial,sans-serif}

/* ---------------- Liquid Glass design (light) ----------------
   --gi (0.35 subtle · 0.65 medium · 1 strong) scales lensing, rims, sheen and shadows.
   Every surface = tint over a blurred, slightly magnified copy of the wallpaper + specular rim + sheen. */
.slide.glass{--gi:.35;font-family:-apple-system,"SF Pro Display","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Inter,Arial,sans-serif;background:var(--wallbase,#E9EDF6);color:#0B0D17}
.slide.glass .wall{position:absolute;inset:0;background-image:var(--wall);background-size:100% 100%}

  text-shadow:0 1px 0 rgba(255,255,255,.6)}
.slide.glass .subtitle{position:absolute;left:60px;top:82px;right:170px;font-size:19px;font-weight:520;color:rgba(18,22,44,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide.glass .t{font-family:-apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Inter,Arial,sans-serif;letter-spacing:-.12px;z-index:3}

.gls{position:absolute;box-sizing:border-box;isolation:isolate}
.gls.wb{background-image:var(--tint,linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5))),var(--wallblur);background-repeat:no-repeat}
.gls::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rim,1.25px);pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,calc(.55 + .45*var(--gi))) 0%,rgba(255,255,255,calc(.6*var(--gi))) 13%,rgba(255,255,255,calc(.1*var(--gi))) 36%,rgba(255,255,255,0) 52%,rgba(255,255,255,calc(.16*var(--gi))) 72%,rgba(255,255,255,calc(.35 + .55*var(--gi))) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gls::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 85% at 16% -20%,rgba(255,255,255,calc(var(--sheen,.6)*var(--gi))) 0%,rgba(255,255,255,calc(.16*var(--gi))) 36%,rgba(255,255,255,0) 56%),
             radial-gradient(80% 55% at 88% 120%,rgba(255,255,255,calc(.34*var(--gi))) 0%,rgba(255,255,255,0) 55%)}

/* cards */
.gls.card{box-shadow:0 22px 48px -24px rgba(28,40,100,calc(.14 + .22*var(--gi))),0 6px 16px -8px rgba(28,40,100,calc(.06 + .1*var(--gi))),
  inset 0 0 0 .5px rgba(255,255,255,.6),inset 0 1px 1px rgba(255,255,255,.95),
  inset 0 -16px 30px -20px rgba(40,60,150,calc(.22*var(--gi))),inset 0 16px 32px -22px rgba(255,255,255,calc(.8*var(--gi)))}
.gls.list{--tint:linear-gradient(180deg,rgba(255,255,255,calc(.86 - .14*var(--gi))),rgba(255,255,255,calc(.78 - .18*var(--gi))))}
.gls.head{--tint:linear-gradient(180deg,rgba(255,255,255,calc(.78 - .18*var(--gi))),rgba(240,244,255,calc(.66 - .22*var(--gi))))}
.gls.tile{--tint:linear-gradient(118deg,rgba(255,255,255,calc(.92 - .12*var(--gi))) 0%,rgba(255,255,255,calc(.76 - .24*var(--gi))) 50%,rgba(255,255,255,calc(.86 - .16*var(--gi))) 100%);--rim:calc(1px + 1px*var(--gi));--sheen:.75;
  box-shadow:0 26px 52px -24px rgba(28,40,100,calc(.16 + .26*var(--gi))),0 8px 18px -10px rgba(28,40,100,calc(.08 + .14*var(--gi))),
  inset 0 0 0 .5px rgba(255,255,255,.65),inset 0 1.5px 1px rgba(255,255,255,1),
  inset 0 -18px 32px -20px rgba(40,60,150,calc(.26*var(--gi))),inset 0 18px 32px -20px rgba(255,255,255,calc(.9*var(--gi)))}
.gls.seg{--tint:linear-gradient(180deg,rgba(255,255,255,calc(.7 - .15*var(--gi))),rgba(255,255,255,calc(.42 - .14*var(--gi))));--rim:1px;--sheen:.45;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 2px 8px -3px rgba(28,40,100,calc(.06 + .12*var(--gi)))}
.xt.gx .emphband{position:absolute;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(28,40,100,.08)}
.xt.gx .headband{position:absolute;border-radius:20px 20px 6px 6px;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(232,240,255,.4));box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}
.xt.gx .hsep{position:absolute;height:1px;background:linear-gradient(90deg,rgba(30,40,80,0),rgba(30,40,80,.14) 5%,rgba(30,40,80,.14) 95%,rgba(30,40,80,0));box-shadow:0 1px 0 rgba(255,255,255,.6)}
.xt.gx .hsep.strong{background:linear-gradient(90deg,rgba(30,40,80,.05),rgba(30,40,80,.22) 4%,rgba(30,40,80,.22) 96%,rgba(30,40,80,.05))}
.xt.gx .vsep{position:absolute;width:1px;background:linear-gradient(180deg,rgba(30,40,80,0),rgba(30,40,80,.16),rgba(30,40,80,0));box-shadow:1px 0 0 rgba(255,255,255,.5)}

/* value capsules: semantic colour stays strong, the glass effect follows --gi */
.gls.pill{--rim:1px;--sheen:.5;box-shadow:inset 0 1px 1px rgba(255,255,255,calc(.4 + .45*var(--gi))),0 2px 6px -2px rgba(28,40,100,calc(.08 + .14*var(--gi)))}
.gls.pill.pos{--tint:linear-gradient(180deg,rgba(64,208,102,calc(.66 - .06*var(--gi))),rgba(46,190,84,calc(.56 - .12*var(--gi))))}
.gls.pill.neg{--tint:linear-gradient(180deg,rgba(255,82,72,calc(.6 - .06*var(--gi))),rgba(245,52,42,calc(.5 - .12*var(--gi))))}
.gls.pill.strong.pos{--tint:linear-gradient(180deg,rgba(64,208,102,.76),rgba(46,190,84,.62))}
.gls.pill.strong.neg{--tint:linear-gradient(180deg,rgba(255,82,72,.72),rgba(245,52,42,.58))}
.gls.pill.muted{--tint:linear-gradient(180deg,rgba(120,126,155,.2),rgba(120,126,155,.12))}
.gls.pill.solid{--rim:1.2px}

.gls.pill.solid.neg{background:linear-gradient(180deg,#FF776D 0%,#FF3B30 55%,#E2261C 100%);box-shadow:0 6px 14px -6px rgba(215,40,30,calc(.28 + .28*var(--gi))),inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(90,0,0,.18)}

/* icons, chrome */
.gls.icon{--tint:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42));--rim:1.2px;padding:2.5px;box-shadow:0 4px 10px -3px rgba(28,40,100,calc(.14 + .2*var(--gi))),inset 0 1px 1px rgba(255,255,255,.95)}
